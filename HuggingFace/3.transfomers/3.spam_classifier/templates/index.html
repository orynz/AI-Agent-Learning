<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스팸 분류기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #161920;
            --border: #252830;
            --muted: #3a3f4d;
            --text: #e8eaf0;
            --sub: #7c8299;
            --accent: #5b8dee;
            --spam: #f04f5a;
            --ham: #34d077;
            --warn: #f7c948;
            --radius: 14px;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Noto Sans KR', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 16px 80px;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 44px;
        }

        header .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(91, 141, 238, .12);
            border: 1px solid rgba(91, 141, 238, .25);
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 11px;
            font-family: var(--mono);
            color: var(--accent);
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        header .badge span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }

        header h1 {
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        header h1 em {
            font-style: normal;
            color: var(--accent);
        }

        header p {
            color: var(--sub);
            font-size: 14px;
            line-height: 1.7;
        }

        /* ── Card ── */
        .card {
            width: 100%;
            max-width: 660px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 20px;
        }

        /* ── Input Area ── */
        .input-label {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--sub);
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: var(--sans);
            font-size: 14.5px;
            line-height: 1.7;
            padding: 14px 16px;
            resize: vertical;
            outline: none;
            transition: border-color .2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--muted);
        }

        /* ── Quick examples ── */
        .examples {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .examples-label {
            width: 100%;
            font-size: 11px;
            color: var(--sub);
            font-family: var(--mono);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 2px;
        }

        .chip {
            font-size: 12px;
            padding: 5px 11px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--sub);
            cursor: pointer;
            font-family: var(--sans);
            transition: all .15s;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(91, 141, 238, .08);
        }

        .chip.spam-chip:hover {
            border-color: var(--spam);
            color: var(--spam);
            background: rgba(240, 79, 90, .08);
        }

        /* ── Button ── */
        .btn-row {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button.analyze {
            flex: 1;
            padding: 13px 20px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-family: var(--sans);
            font-weight: 700;
            font-size: 14.5px;
            cursor: pointer;
            transition: opacity .15s, transform .1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.analyze:hover {
            opacity: .88;
        }

        button.analyze:active {
            transform: scale(.98);
        }

        button.analyze:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        button.clear-btn {
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--sub);
            font-family: var(--sans);
            font-size: 14px;
            cursor: pointer;
            transition: all .15s;
        }

        button.clear-btn:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        /* ── Result ── */
        .result-card {
            width: 100%;
            max-width: 660px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .35s, transform .35s;
        }

        .result-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 22px 26px;
        }

        .result-header.spam {
            background: rgba(240, 79, 90, .1);
            border-bottom: 1px solid rgba(240, 79, 90, .2);
        }

        .result-header.ham {
            background: rgba(52, 208, 119, .1);
            border-bottom: 1px solid rgba(52, 208, 119, .2);
        }

        .verdict-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .spam .verdict-icon {
            background: rgba(240, 79, 90, .2);
        }

        .ham .verdict-icon {
            background: rgba(52, 208, 119, .2);
        }

        .verdict-text h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .spam .verdict-text h2 {
            color: var(--spam);
        }

        .ham .verdict-text h2 {
            color: var(--ham);
        }

        .verdict-text p {
            font-size: 12.5px;
            color: var(--sub);
        }

        .result-body {
            background: var(--surface);
            padding: 22px 26px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .stat-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }

        .stat-box .stat-label {
            font-size: 10.5px;
            font-family: var(--mono);
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 8px;
        }

        .stat-box .stat-value {
            font-size: 22px;
            font-weight: 700;
            font-family: var(--mono);
            line-height: 1;
        }

        .stat-box .stat-sub {
            font-size: 11px;
            color: var(--sub);
            margin-top: 4px;
        }

        /* ── Probability Bar ── */
        .prob-section {
            background: var(--surface);
            padding: 0 26px 22px;
            border-top: 1px solid var(--border);
        }

        .prob-title {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: .08em;
            padding-top: 18px;
            margin-bottom: 14px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 9px;
        }

        .bar-label {
            font-size: 12.5px;
            width: 36px;
            color: var(--sub);
        }

        .bar-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            width: 0%;
            transition: width .7s cubic-bezier(.22, .68, 0, 1.2);
        }

        .bar-fill.spam-bar {
            background: var(--spam);
        }

        .bar-fill.ham-bar {
            background: var(--ham);
        }

        .bar-pct {
            font-size: 12.5px;
            font-family: var(--mono);
            width: 44px;
            text-align: right;
        }

        /* ── Feedback section ── */
        .feedback-section {
            background: var(--surface);
            padding: 0 26px 22px;
            border-top: 1px solid var(--border);
        }

        .feedback-title {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: .08em;
            padding-top: 18px;
            margin-bottom: 12px;
        }

        .feedback-text {
            font-size: 13.5px;
            line-height: 1.75;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }

        .keyword-tag {
            display: inline-block;
            background: rgba(240, 79, 90, .15);
            color: var(--spam);
            border: 1px solid rgba(240, 79, 90, .25);
            border-radius: 4px;
            font-size: 12px;
            padding: 1px 6px;
            margin: 1px 2px;
            font-family: var(--mono);
        }

        .keyword-tag.safe {
            background: rgba(52, 208, 119, .12);
            color: var(--ham);
            border-color: rgba(52, 208, 119, .25);
        }

        /* ── History ── */
        .history-section {
            width: 100%;
            max-width: 660px;
            margin-top: 8px;
        }

        .history-title {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 10px;
            padding-left: 2px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 16px;
            cursor: pointer;
            transition: border-color .15s;
            animation: slideIn .25s ease;
        }

        .history-item:hover {
            border-color: var(--muted);
        }

        .history-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .history-dot.spam {
            background: var(--spam);
        }

        .history-dot.ham {
            background: var(--ham);
        }

        .history-text {
            flex: 1;
            font-size: 13px;
            color: var(--sub);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-badge {
            font-size: 11px;
            font-family: var(--mono);
            padding: 2px 8px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .history-badge.spam {
            background: rgba(240, 79, 90, .15);
            color: var(--spam);
        }

        .history-badge.ham {
            background: rgba(52, 208, 119, .15);
            color: var(--ham);
        }

        /* ── Loading spinner ── */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }

        /* ── API Status ── */
        .api-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-family: var(--mono);
            color: var(--sub);
            margin-bottom: 32px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            transition: background .3s;
        }

        .status-dot.online {
            background: var(--ham);
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: var(--spam);
        }

        /* ── Animations ── */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .4;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Risk badge ── */
        .risk-high {
            color: var(--spam);
        }

        .risk-medium {
            color: var(--warn);
        }

        .risk-low {
            color: var(--ham);
        }

        /* ── Error state ── */
        .error-box {
            background: rgba(240, 79, 90, .08);
            border: 1px solid rgba(240, 79, 90, .25);
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 13.5px;
            color: var(--spam);
            display: none;
            margin-top: 12px;
        }

        .error-box.visible {
            display: block;
        }

        @media (max-width: 500px) {
            .result-body {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="badge"><span></span> Korean Spam Classifier v1.1</div>
        <h1>메일 <em>스팸 탐지</em> 시스템</h1>
        <p>텍스트를 입력하면 AI가 스팸 여부를 분석하고<br>상세한 피드백을 제공합니다.</p>
    </header>

    <div class="api-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">서버 연결 확인 중...</span>
    </div>

    <!-- Input Card -->
    <div class="card">
        <div class="input-label">분석할 메일 내용</div>
        <textarea id="inputText" placeholder="메일 본문을 입력하세요. 예: (광고) 국민은행 당첨! 현금 100만원 받으시려면 지금 클릭하세요"></textarea>

        <div class="examples">
            <div class="examples-label">빠른 예시 →</div>
            <button class="chip spam-chip" onclick="setExample('(광고) 국민은행 당첨! 현금 100만원 받으시려면 지금 클릭하세요')">(광고) 국민은행
                당첨</button>
            <button class="chip spam-chip" onclick="setExample('[긴급] 신한은행 이상 거래 탐지. 본인이 아니시면 링크 확인')">[긴급] 이상
                거래</button>
            <button class="chip spam-chip" onclick="setExample('(Web발신) 비트코인 폭등 예정 종목. 수익률 300% 확정! 바로 접속')">(Web발신)
                비트코인</button>
            <button class="chip" onclick="setExample('[재무팀] 오늘 월간 보고서 첨부파일 참조 바랍니다.')">[재무팀] 월간 보고서</button>
            <button class="chip" onclick="setExample('[알림] 오후 2시에 임원진 미팅 예정입니다. 자료 검토 부탁드립니다.')">[알림] 임원 미팅</button>
        </div>

        <div class="btn-row">
            <button class="analyze" id="analyzeBtn" onclick="analyze()">
                <span id="btnIcon">🔍</span>
                <span id="btnText">분석하기</span>
            </button>
            <button class="clear-btn" onclick="clearAll()">초기화</button>
        </div>
        <div class="error-box" id="errorBox"></div>
    </div>

    <!-- Result Card -->
    <div class="result-card" id="resultCard">

        <div class="result-header" id="resultHeader">
            <div class="verdict-icon" id="verdictIcon"></div>
            <div class="verdict-text">
                <h2 id="verdictTitle"></h2>
                <p id="verdictSub"></p>
            </div>
        </div>

        <div class="result-body">
            <div class="stat-box">
                <div class="stat-label">판정</div>
                <div class="stat-value" id="statLabel" style="font-size:16px; margin-top:4px;"></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">확률</div>
                <div class="stat-value" id="statProb"></div>
                <div class="stat-sub">해당 클래스</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">위험도</div>
                <div class="stat-value" id="statRisk" style="font-size:16px; margin-top:4px;"></div>
            </div>
        </div>

        <div class="prob-section">
            <div class="prob-title">확률 분포</div>
            <div class="bar-row">
                <div class="bar-label">스팸</div>
                <div class="bar-track">
                    <div class="bar-fill spam-bar" id="spamBar"></div>
                </div>
                <div class="bar-pct" id="spamPct"></div>
            </div>
            <div class="bar-row">
                <div class="bar-label">정상</div>
                <div class="bar-track">
                    <div class="bar-fill ham-bar" id="hamBar"></div>
                </div>
                <div class="bar-pct" id="hamPct"></div>
            </div>
        </div>

        <div class="feedback-section">
            <div class="feedback-title">분석 피드백</div>
            <div class="feedback-text" id="feedbackText"></div>
        </div>

    </div>

    <!-- History -->
    <div class="history-section" id="historySection" style="display:none;">
        <div class="history-title">최근 분석 기록</div>
        <div class="history-list" id="historyList"></div>
    </div>


    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let history = [];

        // ── API Health Check ─────────────────────────────
        async function checkHealth() {
            try {
                const r = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(3000) });
                if (r.ok) {
                    document.getElementById("statusDot").className = "status-dot online";
                    document.getElementById("statusText").textContent = "API 서버 연결됨 · " + API_BASE;
                } else throw new Error();
            } catch {
                document.getElementById("statusDot").className = "status-dot offline";
                document.getElementById("statusText").textContent = "서버 오프라인 — 데모 모드로 실행 중";
            }
        }

        // ── Spam Keywords ────────────────────────────────
        const SPAM_KW = ["광고", "WEB발신", "Web발신", "web발신", "긴급", "필독", "경고", "시스템 경고",
            "대출", "투자", "수익률", "비트코인", "이더리움", "알트코인", "급등", "폭등", "클릭",
            "당첨", "VVIP", "무료", "지원금", "환급", "링크 확인", "바로 접속", "채팅방", "앱 다운로드",
            "햇살론", "무보증", "신용불량", "이상 거래", "계좌 정지", "해외 결제", "선착순", "마감"];

        const HAM_KW = ["재무팀", "인사팀", "영업본부", "마케팅팀", "회계팀", "IT지원팀", "감사팀",
            "결재", "보고서", "첨부파일", "미팅", "회의", "기안서", "품의서", "견적서", "세금계산서",
            "검토 부탁", "피드백", "승인", "회신"];

        function highlightKeywords(text, isSpam) {
            let out = text;
            const kw = isSpam ? SPAM_KW : [];
            SPAM_KW.forEach(k => {
                if (out.includes(k)) {
                    out = out.replaceAll(k, `<span class="keyword-tag">${k}</span>`);
                }
            });
            HAM_KW.forEach(k => {
                if (out.includes(k)) {
                    out = out.replaceAll(k, `<span class="keyword-tag safe">${k}</span>`);
                }
            });
            return out;
        }

        // ── Feedback Generator ───────────────────────────
        function generateFeedback(data, text) {
            const sp = data.spam_probability;
            const isSpam = data.label === "spam";

            const foundSpamKw = SPAM_KW.filter(k => text.includes(k));
            const foundHamKw = HAM_KW.filter(k => text.includes(k));

            let fb = "";

            if (isSpam) {
                if (sp >= 0.95) {
                    fb += `⚠️ <strong>매우 높은 스팸 위험</strong>이 감지되었습니다 (확률 ${(sp * 100).toFixed(1)}%).<br><br>`;
                } else if (sp >= 0.75) {
                    fb += `🔶 <strong>스팸으로 판단</strong>됩니다 (확률 ${(sp * 100).toFixed(1)}%).<br><br>`;
                } else {
                    fb += `🟡 <strong>스팸 가능성</strong>이 있습니다 (확률 ${(sp * 100).toFixed(1)}%). 주의가 필요합니다.<br><br>`;
                }
                if (foundSpamKw.length > 0) {
                    fb += `탐지된 스팸 키워드: `;
                    fb += foundSpamKw.slice(0, 6).map(k => `<span class="keyword-tag">${k}</span>`).join(" ");
                    fb += `<br><br>`;
                }
                fb += `📌 <strong>권고사항</strong>: 포함된 링크를 클릭하지 마세요. 개인정보(계좌번호, 비밀번호)를 절대 입력하지 마세요. 발신자를 공식 채널을 통해 직접 확인하세요.`;
            } else {
                if (sp <= 0.05) {
                    fb += `✅ <strong>정상 메일</strong>로 판단됩니다 (스팸 확률 ${(sp * 100).toFixed(1)}%).<br><br>`;
                } else {
                    fb += `🟢 <strong>정상 메일</strong>로 분류되었으나, 일부 주의가 필요합니다 (스팸 확률 ${(sp * 100).toFixed(1)}%).<br><br>`;
                }
                if (foundHamKw.length > 0) {
                    fb += `확인된 업무 관련 키워드: `;
                    fb += foundHamKw.slice(0, 5).map(k => `<span class="keyword-tag safe">${k}</span>`).join(" ");
                    fb += `<br><br>`;
                }
                fb += `📌 <strong>참고</strong>: 발신자 주소와 첨부파일을 재확인하면 더욱 안전합니다. 의심스러운 부분이 있다면 발신자에게 직접 확인하세요.`;
            }

            return fb;
        }

        // ── Mock Prediction (demo mode) ──────────────────
        function mockPredict(text) {
            const spamScore = SPAM_KW.reduce((acc, k) => acc + (text.includes(k) ? 1 : 0), 0);
            const hamScore = HAM_KW.reduce((acc, k) => acc + (text.includes(k) ? 1 : 0), 0);
            const raw = Math.min(0.99, Math.max(0.01, (spamScore * 0.18) - (hamScore * 0.12) + 0.05));
            const spam_probability = spamScore > hamScore ? Math.max(0.6, raw) : Math.min(0.35, raw);
            const label = spam_probability >= 0.5 ? "spam" : "ham";
            const label_ko = label === "spam" ? "스팸" : "정상";
            const risk_level = spam_probability >= 0.75 ? "높음" : spam_probability >= 0.4 ? "중간" : "낮음";
            return {
                label, label_ko, probability: label === "spam" ? spam_probability : 1 - spam_probability,
                spam_probability, risk_level
            };
        }

        // ── Main Analyze ─────────────────────────────────
        async function analyze() {
            const text = document.getElementById("inputText").value.trim();
            if (!text) {
                showError("메일 내용을 입력해주세요.");
                return;
            }
            hideError();
            setLoading(true);

            let data;
            try {
                const resp = await fetch(`${API_BASE}/predict`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text }),
                    signal: AbortSignal.timeout(5000),
                });
                if (!resp.ok) throw new Error(await resp.text());
                data = await resp.json();
            } catch {
                // 서버 없으면 데모 모드
                data = mockPredict(text);
            }

            renderResult(data, text);
            addHistory(text, data);
            setLoading(false);
        }

        // ── Render Result ────────────────────────────────
        function renderResult(data, text) {
            const isSpam = data.label === "spam";
            const card = document.getElementById("resultCard");
            const header = document.getElementById("resultHeader");

            // reset animation
            card.classList.remove("visible");

            header.className = "result-header " + (isSpam ? "spam" : "ham");
            document.getElementById("verdictIcon").textContent = isSpam ? "🚫" : "✅";
            document.getElementById("verdictTitle").textContent = isSpam ? "스팸 메일 감지됨" : "정상 메일";
            document.getElementById("verdictSub").textContent =
                isSpam ? "이 메일은 스팸으로 분류되었습니다. 주의하세요." :
                    "이 메일은 정상으로 분류되었습니다.";

            document.getElementById("statLabel").textContent = data.label_ko;
            document.getElementById("statLabel").style.color = isSpam ? "var(--spam)" : "var(--ham)";

            document.getElementById("statProb").textContent = (data.probability * 100).toFixed(1) + "%";
            document.getElementById("statProb").style.color = isSpam ? "var(--spam)" : "var(--ham)";

            const riskEl = document.getElementById("statRisk");
            riskEl.textContent = data.risk_level;
            riskEl.className = "stat-value risk-" +
                (data.risk_level === "높음" ? "high" : data.risk_level === "중간" ? "medium" : "low");

            const spamPct = Math.round(data.spam_probability * 100);
            const hamPct = 100 - spamPct;

            document.getElementById("spamPct").textContent = spamPct + "%";
            document.getElementById("hamPct").textContent = hamPct + "%";

            // bars animate after mount
            setTimeout(() => {
                document.getElementById("spamBar").style.width = spamPct + "%";
                document.getElementById("hamBar").style.width = hamPct + "%";
            }, 80);

            document.getElementById("feedbackText").innerHTML = generateFeedback(data, text);

            requestAnimationFrame(() => { card.classList.add("visible"); });
        }

        // ── History ──────────────────────────────────────
        function addHistory(text, data) {
            history.unshift({ text, data, time: new Date() });
            if (history.length > 6) history.pop();
            renderHistory();
        }

        function renderHistory() {
            const section = document.getElementById("historySection");
            const list = document.getElementById("historyList");
            if (history.length === 0) { section.style.display = "none"; return; }
            section.style.display = "block";
            list.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="reloadHistory(${i})">
      <div class="history-dot ${h.data.label}"></div>
      <div class="history-text">${h.text.slice(0, 55)}${h.text.length > 55 ? "…" : ""}</div>
      <span class="history-badge ${h.data.label}">${h.data.label_ko} ${(h.data.spam_probability * 100).toFixed(0)}%</span>
    </div>
  `).join("");
        }

        function reloadHistory(idx) {
            const h = history[idx];
            document.getElementById("inputText").value = h.text;
            renderResult(h.data, h.text);
        }

        // ── Helpers ──────────────────────────────────────
        function setExample(text) {
            document.getElementById("inputText").value = text;
            document.getElementById("inputText").focus();
        }

        function clearAll() {
            document.getElementById("inputText").value = "";
            document.getElementById("resultCard").classList.remove("visible");
            hideError();
        }

        function setLoading(on) {
            const btn = document.getElementById("analyzeBtn");
            const icon = document.getElementById("btnIcon");
            const txt = document.getElementById("btnText");
            btn.disabled = on;
            if (on) {
                icon.outerHTML = `<div class="spinner" id="btnIcon"></div>`;
                txt.textContent = "분석 중...";
            } else {
                document.getElementById("btnIcon").outerHTML = `<span id="btnIcon">🔍</span>`;
                txt.textContent = "분석하기";
            }
        }

        function showError(msg) {
            const el = document.getElementById("errorBox");
            el.textContent = "⚠ " + msg;
            el.classList.add("visible");
        }
        function hideError() {
            document.getElementById("errorBox").classList.remove("visible");
        }

        // ── Enter key shortcut ───────────────────────────
        document.getElementById("inputText").addEventListener("keydown", e => {
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) analyze();
        });

        // ── Init ─────────────────────────────────────────
        checkHealth();
    </script>
</body>
