<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 영화 심리 처방전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0c0c0e;
      --surface:  #131316;
      --panel:    #1a1a1f;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.13);
      --text:     #e8e6e0;
      --muted:    #7a7872;
      --accent:   #c9a96e;
      --accent2:  #8b6f47;
      --danger:   #c0392b;
      --serif:    'Noto Serif KR', serif;
      --sans:     'Noto Sans KR', sans-serif;
      --mono:     'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* 필름 그레인 오버레이 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.028;
      pointer-events: none;
      z-index: 9999;
    }

    /* 레이아웃 */
    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
    }

    /* 헤더 */
    header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .header-logo {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .header-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.5;
      margin-left: auto;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50%       { opacity: 0.9; transform: scale(1.3); }
    }

    /* 채팅 영역 */
    #chat-box {
      overflow-y: auto;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      scroll-behavior: smooth;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* 메시지 버블 */
    .message { display: flex; flex-direction: column; gap: 10px; animation: fadeUp .35s ease both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-items: flex-end; }
    .message.bot  { align-items: flex-start; }

    .bubble-user {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 18px 18px 4px 18px;
      padding: 12px 18px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 60%;
      color: var(--text);
    }

    /* 감정 공감 멘트 */
    .empathy-block {
      border-left: 2px solid var(--accent2);
      padding: 10px 16px;
      margin-bottom: 4px;
      font-family: var(--serif);
      font-size: 13px;
      line-height: 1.9;
      color: #b0aa9e;
      max-width: 520px;
    }

    /* 영화 카드 그리드 */
    .movie-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 760px;
    }

    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: default;
      transition: border-color .25s, transform .25s;
      animation: fadeUp .4s ease both;
    }

    .movie-card:hover {
      border-color: var(--border2);
      transform: translateY(-3px);
    }

    /* 포스터 */
    .poster-wrap {
      position: relative;
      aspect-ratio: 2/3;
      background: var(--panel);
      overflow: hidden;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }

    .movie-card:hover .poster-wrap img { transform: scale(1.04); }

    /* 포스터 없을 때 플레이스홀더 */
    .poster-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
    }

    .poster-placeholder svg { opacity: 0.3; }
    .poster-placeholder span { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; }

    .rating-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(12,12,14,.85);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 2px 7px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      backdrop-filter: blur(4px);
    }

    /* 카드 본문 */
    .card-body {
      padding: 11px 12px 13px;
      display: flex;
      flex-direction: column;
      height: 180px; /* 카드의 고정 높이 설정 (필요에 따라 조절) */
    }

    .card-title {
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 6px;
      text-overflow: ellipsis;
      overflow: hidden;
      flex-shrink: 0; /* 제목 영역은 줄어들지 않게 */
    }

    .card-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.65;
      overflow-y: auto; /* 세로 스크롤 활성화 */
      flex-grow: 1; /* 남은 공간을 설명 영역이 채움 */
      word-break: break-word;
      /* 스크롤바 스타일링 (선택 사항 - 웹킷 브라우저용) */
      padding-right: 5px;
    }

    /* 로딩 스켈레톤 */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
      max-width: 760px;
    }

    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .skeleton-poster {
      aspect-ratio: 2/3;
      background: var(--panel);
      position: relative;
      overflow: hidden;
    }

    .skeleton-poster::after,
    .skeleton-line::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    .skeleton-body { padding: 11px 12px; display: flex; flex-direction: column; gap: 6px; }

    .skeleton-line {
      height: 10px;
      border-radius: 4px;
      background: var(--panel);
      position: relative;
      overflow: hidden;
    }

    .skeleton-line.w70 { width: 70%; }
    .skeleton-line.w90 { width: 90%; }
    .skeleton-line.w55 { width: 55%; }

    /* 타이핑 인디케이터 */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 0;
    }

    .typing span {
      width: 5px;
      height: 5px;
      background: var(--muted);
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }

    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    /* 에러 */
    .error-msg {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--danger);
      padding: 10px 14px;
      border: 1px solid rgba(192,57,43,.25);
      border-radius: 8px;
      background: rgba(192,57,43,.06);
    }

    /* 빈 상태 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      user-select: none;
    }

    .empty-icon {
      font-size: 36px;
      opacity: 0.25;
    }

    .empty-title {
      font-family: var(--serif);
      font-size: 16px;
      color: var(--muted);
      font-weight: 300;
    }

    .empty-hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      opacity: 0.5;
      letter-spacing: .05em;
    }

    /* 예시 프롬프트 칩 */
    .prompt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-top: 6px;
    }

    .chip {
      font-size: 12px;
      padding: 6px 13px;
      border: 1px solid var(--border2);
      border-radius: 20px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .2s, color .2s;
      background: none;
      font-family: var(--sans);
    }

    .chip:hover { border-color: var(--accent2); color: var(--accent); }

    /* 입력 영역 */
    #input-area {
      padding: 16px 32px 24px;
      border-top: 1px solid var(--border);
    }

    .input-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 10px 10px 10px 18px;
      transition: border-color .2s;
    }

    .input-inner:focus-within { border-color: var(--accent2); }

    #prompt {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 300;
      caret-color: var(--accent);
    }

    #prompt::placeholder { color: var(--muted); }

    #send-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #0c0c0e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .15s, opacity .2s;
    }

    #send-btn:hover:not(:disabled) { background: #d4b47a; transform: scale(1.05); }
    #send-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

    #send-btn svg { width: 16px; height: 16px; }

    .input-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: right;
      margin-top: 8px;
      opacity: 0.4;
      letter-spacing: .05em;
    }
  </style>
</head>
<body>

<div class="shell">
  <header>
    <span class="header-logo">🎬 영화 심리 처방전</span>
    <span class="header-sub">AI Movie Therapist</span>
    <span class="header-dot"></span>
  </header>

  <div id="chat-box">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🎞</div>
      <p class="empty-title">오늘 당신의 마음에 맞는 영화를 찾아드려요</p>
      <p class="empty-hint">지금 기분이나 상황을 자유롭게 말해보세요</p>
      <div class="prompt-chips">
        <button class="chip" onclick="setPrompt(this)">요즘 너무 무기력해</button>
        <button class="chip" onclick="setPrompt(this)">짜릿한 영화 보고 싶어</button>
        <button class="chip" onclick="setPrompt(this)">7세 아이와 볼 용기 있는 영화</button>
        <button class="chip" onclick="setPrompt(this)">실연당한 친구한테 추천해줄 영화</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-inner">
      <input
        type="text"
        id="prompt"
        placeholder="지금 기분은 어떤가요?..."
        autocomplete="off"
        maxlength="200"
      >
      <button id="send-btn" title="처방받기">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="14" y1="2" x2="2" y2="8"/><line x1="14" y1="2" x2="9" y2="14"/><line x1="2" y1="8" x2="9" y2="14"/>
        </svg>
      </button>
    </div>
    <p class="input-hint">Enter ↵ to send</p>
  </div>
</div>

<script>
  const chatBox   = document.getElementById('chat-box');
  const input     = document.getElementById('prompt');
  const sendBtn   = document.getElementById('send-btn');
  const emptyState = document.getElementById('empty-state');

  let isLoading = false;
  let activeSource = null;

  // 칩 클릭
  function setPrompt(el) {
    input.value = el.textContent;
    input.focus();
  }

  // 엔터키
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  function setLoading(state) {
    isLoading = state;
    sendBtn.disabled = state;
    input.disabled = state;
  }

  function hideEmpty() {
    if (emptyState) emptyState.remove();
  }

  // 사용자 메시지
  function appendUser(text) {
    hideEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'message user';
    wrap.innerHTML = `<div class="bubble-user">${escapeHtml(text)}</div>`;
    chatBox.appendChild(wrap);
    scrollBottom();
  }

  // 타이핑 인디케이터
  function appendTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'message bot';
    wrap.id = 'typing-indicator';
    wrap.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    chatBox.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // 스켈레톤 로더
  function appendSkeleton() {
    removeTyping();
    const wrap = document.createElement('div');
    wrap.className = 'message bot';
    wrap.id = 'skeleton-loader';
    const cards = Array.from({length: 5}, () => `
      <div class="skeleton-card">
        <div class="skeleton-poster"><div style="position:relative;height:100%;overflow:hidden;">
          <div style="position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.04) 50%,transparent 100%);animation:shimmer 1.5s infinite;"></div>
        </div></div>
        <div class="skeleton-body">
          <div class="skeleton-line w90"></div>
          <div class="skeleton-line w70"></div>
          <div class="skeleton-line w55"></div>
        </div>
      </div>
    `).join('');
    wrap.innerHTML = `<div class="skeleton-grid">${cards}</div>`;
    chatBox.appendChild(wrap);
    scrollBottom();
  }

  function removeSkeleton() {
    const el = document.getElementById('skeleton-loader');
    if (el) el.remove();
  }

  // 에러 메시지
  function appendError(msg) {
    removeSkeleton(); removeTyping();
    const wrap = document.createElement('div');
    wrap.className = 'message bot';
    wrap.innerHTML = `<div class="error-msg">⚠ ${escapeHtml(msg)}</div>`;
    chatBox.appendChild(wrap);
    scrollBottom();
  }

  // 영화 카드 렌더링
  function appendMovies(movies, empathy) {
    removeSkeleton();
    const wrap = document.createElement('div');
    wrap.className = 'message bot';

    // 공감 멘트
    let empathyHtml = '';
    if (empathy) {
      const lines = String(empathy).split(/[\/\n]/).map(s => s.trim()).filter(Boolean).join('<br>');
      empathyHtml = `<div class="empathy-block">${lines}</div>`;
    }

    // 카드 그리드
    const cardsHtml = movies.map((m, i) => {
      const posterHtml = m.poster && m.poster !== 'null'
        ? `<img src="${escapeHtml(m.poster)}" alt="${escapeHtml(m.title)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'poster-placeholder\\'><svg width=\\'28\\' height=\\'28\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1.2\\'><rect x=\\'2\\' y=\\'3\\' width=\\'20\\' height=\\'18\\' rx=\\'2\\'/><path d=\\'M8 3v18M16 3v18\\'/></svg><span>No Image</span></div>'">`
        : `<div class="poster-placeholder"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8 3v18M16 3v18"/></svg><span>No Image</span></div>`;

      return `
        <div class="movie-card" style="animation-delay:${i * 70}ms">
          <div class="poster-wrap">
            ${posterHtml}
            <span class="rating-badge">★ ${m.rating ?? '—'}</span>
          </div>
          <div class="card-body">
            <p class="card-title">${escapeHtml(m.title ?? '제목 없음')}</p>
            <p class="card-desc">${escapeHtml((m.desc ?? '').replace(/\.{3}$/, '') || '설명 없음')}</p>
          </div>
        </div>
      `;
    }).join('');

    wrap.innerHTML = `${empathyHtml}<div class="movie-cards">${cardsHtml}</div>`;
    chatBox.appendChild(wrap);
    scrollBottom();
  }

  // 메인 전송 함수
  function sendMessage() {
    const text = input.value.trim();
    if (!text || isLoading) return;

    // 이전 SSE 연결 정리
    if (activeSource) { activeSource.close(); activeSource = null; }

    setLoading(true);
    appendUser(text);
    input.value = '';

    appendTyping();

    // SSE 연결
    const source = new EventSource(`/chat_stream?prompt=${encodeURIComponent(text)}`);
    activeSource = source;

    let firstMessage = true;

    source.onmessage = (e) => {
      try {
        const res = JSON.parse(e.data);

        if (res.status === 'emotion') {
          // 감정 분석 완료 → 스켈레톤으로 전환
          appendSkeleton();
        } else if (res.status === 'processing') {
          if (firstMessage) { appendSkeleton(); firstMessage = false; }
          const movies = Array.isArray(res.data) ? res.data : [];
          const empathy = movies[0]?.reason ?? null;
          appendMovies(movies, empathy);
        } else if (res.status === 'complete') {
          source.close();
          activeSource = null;
          setLoading(false);
        }
      } catch (err) {
        appendError('응답 파싱 중 오류가 발생했습니다.');
        source.close();
        setLoading(false);
      }
    };

    source.onerror = () => {
      removeSkeleton(); removeTyping();
      appendError('서버와의 연결이 끊겼습니다. 잠시 후 다시 시도해주세요.');
      source.close();
      activeSource = null;
      setLoading(false);
    };

    // 타임아웃 (15초)
    setTimeout(() => {
      if (activeSource) {
        removeSkeleton(); removeTyping();
        appendError('응답 시간이 초과되었습니다. 다시 시도해주세요.');
        activeSource.close();
        activeSource = null;
        setLoading(false);
      }
    }, 15000);
  }

  function scrollBottom() {
    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>
</body>
</html>
