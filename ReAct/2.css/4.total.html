<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>초급 Tailwind AI 대시보드</title>
</head>
<body class="
    /* 배경색: 매우 밝은 회색 (gray-50) */
    bg-gray-50 
    /* 높이: 화면 전체 높이 (height: 100vh) */
    h-screen 
    /* 플렉스 컨테이너: 수직 방향으로 배치 */
    flex 
    flex-col 
    /* 폰트 패밀리: 사인스(Sans) 폰트 사용 */
    font-sans
">

    <header class="
        /* 배경색: 흰색 */
        bg-white 
        /* 아래 테두리: 1px 두께의 회색 테두리 */
        border-b 
        /* 상하 패딩: 1rem (16px) */
        py-4 
        /* 그림자: 가벼운 그림자 효과 */
        shadow-sm
    ">
        <h1 class="
            /* 텍스트 정렬: 중앙 정렬 */
            text-center 
            /* 텍스트 크기: xl (1.25rem / 20px) */
            text-xl 
            /* 글꼴 두께: Extrabold (800) */
            font-extrabold 
            /* 글자색: 진한 파란색 (blue-700) */
            text-blue-700
        ">AI AGENT DASHBOARD</h1>
    </header>

    <main class="
        /* 화면 남은 공간 확보 (flex-grow) */
        flex-1 
        /* 내부 패딩: 1.5rem (24px) */
        p-6 
        /* 플렉스 방향: 수직 → 화면이 넓어지면 수평으로 전환 (md: flex-row) */
        flex 
        flex-col 
        md:flex-row 
        /* 자식 요소 간 간격: 1.5rem (24px) */
        gap-6
    ">
        
        <section class="
            /* 배경색: 흰색 */
            bg-white 
            /* 내부 패딩: 1.5rem (24px) */
            p-6 
            /* 모서리 둥글기: 1.5rem (24px) */
            rounded-2xl 
            /* 그림자: 가벼운 그림자 */
            shadow-sm 
            /* 테두리: 1px, 회색-200 색상 */
            border 
            border-gray-200 
            /* 화면이 md 이상일 때 너비: 1/3 */
            md:w-1/3
        ">
            <h2 class="
                /* 글꼴 두께: Bold (700) */
                font-bold 
                /* 글자색: 어두운 회색 (gray-800) */
                text-gray-800 
                /* 아래 마진: 1rem (16px) */
                mb-4
            ">분석 설정</h2>
            
            <div class="
                /* 자식 요소 간 수직 간격: 1rem (16px) */
                space-y-4
            ">
                <div>
                    <label class="
                        /* 블록 요소로 변환 */
                        block 
                        /* 글자 크기: xs (0.75rem / 12px) */
                        text-xs 
                        /* 글꼴 두께: Bold (700) */
                        font-semibold 
                        /* 글자색: 밝은 회색 (gray-500) */
                        text-gray-500 
                        /* 아래 마진: 0.25rem (4px) */
                        mb-1
                    ">기업명</label>
                    <input type="text" class="
                        /* 너비: 부모 요소 전체 */
                        w-full 
                        /* 테두리: 1px */
                        border 
                        /* 내부 패딩: 0.5rem (8px) */
                        p-2 
                        /* 모서리 둥글기: 0.375rem (6px) */
                        rounded-md 
                        /* 포커스 시 테두리 제거 */
                        outline-none 
                        /* 포커스 시 블루-400 색상의 링 효과 */
                        focus:ring-2 
                        focus:ring-blue-400
                    " placeholder="삼성전자">
                </div>
                <button class="
                    /* 너비: 부모 요소 전체 */
                    w-full 
                    /* 배경색: 진한 파란색 (blue-600) */
                    bg-blue-600 
                    /* 글자색: 흰색 */
                    text-white 
                    /* 내부 패딩: 0.5rem (8px) */
                    py-2 
                    /* 모서리 둥글기: 0.375rem (6px) */
                    rounded-md 
                    /* 글꼴 두께: Bold (700) */
                    font-bold 
                    /* 호버 시 배경색: 더 진한 파란색 (blue-700) */
                    hover:bg-blue-700 
                    /* 전환 효과: 부드러운 애니메이션 */
                    transition
                ">분석 시작</button>
            </div>
        </section>

        <article class="
            /* 배경색: 흰색 */
            bg-white 
            /* 내부 패딩: 1.5rem (24px) */
            p-6 
            /* 모서리 둥글기: 1.5rem (24px) */
            rounded-2xl 
            /* 그림자: 가벼운 그림자 */
            shadow-sm 
            /* 테두리: 1px, 회색-200 색상 */
            border 
            border-gray-200 
            /* 가로 공간을 모두 차지 (flex-grow) */
            flex-1
        ">
            <h2 class="
                /* 글꼴 두께: Bold (700) */
                font-bold 
                /* 글자색: 어두운 회색 (gray-800) */
                text-gray-800 
                /* 아래 마진: 1rem (16px) */
                mb-4
            ">작업 현황</h2>
            <div class="
                /* 배경색: 어두운 회색 (gray-900) */
                bg-gray-900 
                /* 내부 패딩: 1rem (16px) */
                p-4 
                /* 모서리 둥글기: 0.75rem (12px) */
                rounded-xl 
                /* 글자색: 연한 녹색 (green-400) */
                text-green-400 
                /* 글꼴: 모노스페이스 (monospace) */
                font-mono 
                /* 글자 크기: sm (0.875rem / 14px) */
                text-sm 
                /* 높이: 12rem (192px) */
                h-48 
                /* 수직 스크롤 허용 */
                overflow-y-auto
            ">
                <p>&gt; [에이전트] 대기 중...</p>
                <p>&gt; [에이전트] 분석 요청을 기다리고 있습니다.</p>
            </div>
        </article>

    </main>

    <footer class="
        /* 배경색: 흰색 */
        bg-white 
        /* 내부 패딩: 1rem (16px) */
        p-4 
        /* 위 테두리: 1px */
        border-t 
        /* 텍스트 정렬: 중앙 */
        text-center 
        /* 글자색: 밝은 회색 (gray-400) */
        text-gray-400 
        /* 글자 크기: xs (0.75rem / 12px) */
        text-xs
    ">
        &copy; 2026 AI Agent Veteran Developer Team Leader
    </footer>

</body>
</html>
