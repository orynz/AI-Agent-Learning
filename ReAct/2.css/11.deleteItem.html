<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>글 삭제하기</title>
</head>

<body class="bg-gray-100 flex items-center h-screen justify-center">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
        <h2 class="text-center font-bold text-2xl mb-6">글 삭제하기</h2>

        <!-- 제목 입력 -->
        <div class="mb-4">
            <label for="text" class="block text-center text-gray-700 mb-2">정말로 이글을 삭제하시겠습니까?</label>
        </div>
        
        <div class="flex justify-between mt-">
            <!-- 버튼 - 취소 -->
            <button class="w-full bg-gray-500 hover:bg-gray-600 text-white py-2 mx-5 transition rounded">취소</button>
            
            <!-- 버튼 - 작성하기 -->
            <button class="w-full bg-red-500 hover:bg-red-600 text-white py-2 mx-5 transition rounded">삭제</button>
        </div>
        
    </div>
</body>

</html>
