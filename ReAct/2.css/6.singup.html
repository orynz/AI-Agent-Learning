<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>회원 가입</title>
</head>

<body class="bg-gray-100 flex items-center h-screen justify-center">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
        <h2 class="text-center font-bold text-2xl mb-6">회원 가입</h2>

        <!-- 이름 입력 -->
        <div class="mb-4">
            <label for="username" class="block text-gray-700 mb-2">이름</label>
            <input type="text" placeholder="아이디 입력"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <!-- 이메일 입력 -->
         <div class="mb-4">
            <label for="email" class="block text-gray-700 mb-2">이메일</label>
            <input type="email" placeholder="yourmail@example.com"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
         </div>
        <!-- 비밀번호 -->
         <div class="mb-4">
            <label for="pw" class="block text-gray-700 mb-2">비밀번호</label>
            <input type="password" placeholder="영문/숫자 포함 8자리 이상"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
         </div>
        <!-- 비밀번호 확인 -->
<div class="mb-4">
            <label for="pw-check" class="block text-gray-700 mb-2">비밀번호 확인</label>
            <input type="password" placeholder="영문/숫자 포함 8자리 이상"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
         </div>
        <!-- 버튼 -->
        <button class="w-full bg-green-500 hover:bg-green-600 text-white py-2 transition rounded">회원 가입</button>
        
        <!-- 돌아가기 -->
         <div class="flex justify-center mt-4 text-sm text-blue-600 hover:text-blue-800">
            <a href="5.login.html">로그인으로 돌아가기</a>
         </div>
    </div>
</body>

</html>
