<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>글 수정하기</title>
</head>

<body class="bg-gray-100 flex items-center h-screen justify-center">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full m-8">
        <h2 class="text-center font-bold text-2xl mb-6">글 수정하기</h2>

        <!-- 제목 입력 -->
        <div class="mb-4">
            <label for="text" class="block text-gray-700 mb-2">제목</label>
            <input type="text" placeholder="제목 입력" value="첫 번째 글"
                class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <!-- 작성자 -->
        <div class="mb-4">
            <label for="author" class="block text-gray-700 mb-2">작성자</label>
            <input type="text" placeholder="작성자" value="홍길동"
                class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 내용 -->
        <div class="mb-4">
            <label for="author" class="block text-gray-700 mb-2">내용</label>
            <textarea name="" id="" placeholder="내용 입력" 
                class="w-full px-1 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            여기에 글 내용이 표시 됩니다.
            </textarea>
        </div>

        <div class="flex justify-between mt-4">
            <!-- 버튼 - 취소 -->
            <button class="w-full bg-gray-500 hover:bg-gray-600 text-white py-2 m-2 transition rounded">취소</button>
            
            <!-- 버튼 - 작성하기 -->
            <button class="w-full bg-green-500 hover:bg-green-600 text-white py-2 m-2 transition rounded">수정하기</button>
        </div>
        
    </div>
</body>

</html>
