<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. 변수의 개요 및 작성법</title>

    <script>
        var name = "홍길동"
        // alert(name)
        var user_name = prompt("당신의 이름을 입력하세요")
        var user_age = prompt("당싱의 나이는?")
    </script>
</head>

<body>
    <script>
        document.write("name: ", user_name, "<br>")
        document.write("나이는? "+ user_age +"")
    </script>
    <!-- ol>li*3 -->
    <ol>
        <li>변수(variable) => 사용자로부터 값을 입력(문자, 숫자, 논리적인 값) <br>
            을 입력받아서 메모리에 저장(주소값) -> 변수 이름으로 저장, 불러오기 </li>
        <li>var 변수명(명사)=값으로 선언해서 사용</li>
        <li>변수명은 대.소문자 구분(name, Name, NAME)</li>
        <li>출력구문: docment.write('문자열')</li>
    </ol>
</body>

</html>
