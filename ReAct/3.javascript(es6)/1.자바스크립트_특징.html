<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. 자바스크립트 특징</title>

    <script>
        alert("자바스크립트 실행중...")
    </script>
</head>
<body>
    <!-- section>article>ol>li*7 -->
     <script>
        alert('또 자바스크립트 실행중...')
     </script>

     <section>
        <article>
            <ol>
                <li>브라우저에서 실행(run)이 되는 언어(html)</li>
                <li>script 태그를 이용, head, body 에서 소스코드를 작성</li>
                <li>문법에 맞게 내용을 작성한 파일(source file).js</li>
                <li>자바스크립트는 컴파일 과정이 없고 실행이 되는 언어</li>
                <li>디버깅(=에러검출)이 어려움</li>
                <li>플랫폼에 상관없이 다 실행 된다.</li>
                <li>경우에 따라서는 파일로 불러와서 실행이 됨</li>
            </ol>
        </article>
     </section>
</body>
</html>
